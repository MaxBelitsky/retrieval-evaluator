name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c 'import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"];
          tag = os.environ["RELEASE_TAG"];
          assert tag in {version, f"v{version}"}, f"release tag {tag!r} does not match package version {version!r}"'

      - name: Install test dependencies
        run: uv sync --locked --all-extras --group dev

      - name: Verify release candidate
        run: |
          uv run --locked ruff check retrieval_evaluator tests examples
          uv run --locked pytest -p no:cacheprovider

      - name: Build package
        run: uv build

      - name: Validate distributions
        run: |
          uv run --locked twine check dist/*
          uv run --locked check-wheel-contents dist/*.whl

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
